<app-nav></app-nav>
<div class="projects pt-s pt-lg-l d-flex flex-column align-items-center">
  <a [routerLink]="['/']" class="btn mb-s">
    <svg
      style="width: 1rem; transform: rotate(90deg) translateX(-1px)"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M12 20L12 4"
        stroke="currentColor"
        fill="none"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M5 13L12 20L19 13"
        stroke="currentColor"
        fill="none"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    Back to Home</a
  >
  <h1 class="syncopate mb-m">All Projects</h1>
  <div *ngIf="isLoading" class="container">
    <p>Loading projects...</p>
  </div>
  <div
    class="all-projects container"
    *ngIf="!isLoading && projectList.length > 0"
  >
    <div class="row">
      <app-project
        *ngFor="let project of projectList"
        [project]="project"
        class="col-lg-4"
      ></app-project>
    </div>
  </div>
  <div *ngIf="!isLoading && projectList.length === 0" class="container">
    <p>No projects found.</p>
  </div>
</div>
